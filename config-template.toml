# Web Search config - copy to ~/.pi/web-search.toml
# Works out of the box with Exa (no key needed)

provider = "auto"      # "auto", "all", or specific provider
workflow = "none"      # "none", "summary-review", "auto-summary"

# API Keys (uncomment to enable)
# exaApiKey = "exa-..."
# parallelApiKey = "..."
# braveApiKey = "BSA_..."
# openaiApiKey = "sk-..."
# perplexityApiKey = "pplx-..."
# geminiApiKey = "AIza..."
# tavilyApiKey = "tvly-..."
# search1apiApiKey = "..."
# searchinfinityApiKey = "..."
# queritApiKey = "..."
# tinyfishApiKey = "..."
# jinaApiKey = "jina_..."
# bochaApiKey = "sk-..."
# kagiApiKey = "..."
# ollamaApiKey = "..."
# serpbaseApiKey = "..."
# xaiApiKey = "..."
# anysearchApiKey = "..."
# brightdataApiKey = "..."
# brightdataSerpZone = "..."

# Other
# autoOpenBrowser = true
# maxInlineContentChars = 50000
